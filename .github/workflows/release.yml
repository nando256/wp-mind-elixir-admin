name: Build and Release WordPress Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v1.2 or v1.3.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Create Plugin Zip Archive
        run: |
          mkdir -p build/wp-mind-elixir-admin
          rsync -rc --exclude='.git*' --exclude='.github' --exclude='build' --exclude='*.zip' ./ build/wp-mind-elixir-admin/
          cd build
          zip -r ../wp-mind-elixir-admin.zip wp-mind-elixir-admin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: wp-mind-elixir-admin.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
